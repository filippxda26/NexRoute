name: Frontend CI

on:
  pull_request:
    paths:
      - 'fe-app-nexroute/**'
      - 'luci-app-nexroute/**'
      # The suite includes checks that compare the page with what the package
      # ships, and fixtures it shares with the backend tests.
      - 'nexroute/files/etc/config/nexroute'
      - 'tests/fixtures/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'fe-app-nexroute/**'
      - 'luci-app-nexroute/**'
      - 'nexroute/files/etc/config/nexroute'
      - 'tests/fixtures/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Quality Checks
    outputs:
      generated: ${{ steps.build.outputs.generated }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe-app-nexroute

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        working-directory: fe-app-nexroute
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4.3.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('fe-app-nexroute/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        id: format
        run: |
          yarn format
          if ! git diff --exit-code; then
            echo "::error::Code is not formatted. Run 'yarn format' locally."
            exit 1
          fi

      - name: Run linter
        run: yarn lint --max-warnings=0

      - name: Run tests
        run: yarn test --run

      - name: Build project
        id: build
        run: |
          yarn build
          echo 'generated=true' >> "$GITHUB_OUTPUT"
          if ! git diff --exit-code; then
            echo "::error::Build generated changes. Check build output."
            exit 1
          fi

      - name: Upload regenerated bundle
        if: failure() && steps.build.outputs.generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: nexroute-regenerated-luci
          path: luci-app-nexroute/htdocs/luci-static/resources/view/nexroute/main.js
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        if: always()
        run: |
          echo "## Frontend CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Format check: ${{ steps.format.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint check: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "![Success](https://cdn2.combot.org/boratbrat/webp/6xf09f988f.webp)" >> $GITHUB_STEP_SUMMARY

  # Temporary one-file synchronization after the project rename.
  sync-renamed-luci:
    needs: frontend-checks
    if: ${{ always() && needs.frontend-checks.result == 'failure' && needs.frontend-checks.outputs.generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'filippxda26/NexRoute' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: nexroute-regenerated-luci
          path: ${{ runner.temp }}/nexroute-bundle
      - name: Commit only the generated LuCI view
        shell: bash
        run: |
          set -euo pipefail
          target=luci-app-nexroute/htdocs/luci-static/resources/view/nexroute/main.js
          test -s "$RUNNER_TEMP/nexroute-bundle/main.js"
          cp "$RUNNER_TEMP/nexroute-bundle/main.js" "$target"
          git add -- "$target"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Regenerate NexRoute LuCI bundle"
          git push origin HEAD:refs/heads/main
